# Homebucket 镜像流水线
#
# 参照 DockerFileTest / ciTest 的取舍：
#   · 只在容器内构建：用 kaniko 在容器里构建并推送镜像，不需要 docker daemon / dind，
#     也不需要 privileged runner。kaniko 镜像走加速域名（替代 gcr.io / ghcr.io）。
#   · check 阶段先做"便宜但拦得住人"的检查：server 类型检查 + 结构漂移探针、
#     web 类型检查。镜像构建里的 nest build / nuxt build 只覆盖一部分：
#     nuxt build 走 vite/esbuild 只转译、**不做类型检查**，web 的类型错误只能靠 vue-tsc 拦。
#   · 不保留任何产物：没有 artifacts，构建结果只以镜像形式进入项目的容器注册表。
#
# 加速域名（都可通过 CI/CD Variables 覆盖）：
#   NODE_IMAGE     基础镜像，默认走 docker.1ms.run（Docker Hub 加速）
#   NPM_REGISTRY   npm 源，默认走 npmmirror
#   kaniko 镜像本身在 gcr.io，用 gcr.m.daocloud.io 加速（ghcr.io 对应 ghcr.m.daocloud.io）
#
# 已经不需要的构建变量（Prisma → TypeORM 迁移后删掉）：
#   DB_PROVIDER   数据库驱动改为运行期由环境变量 DB_PROVIDER 决定：
#                 mysql2 / better-sqlite3 都已是生产依赖，同一个镜像两种库都能跑
#   APT_MIRROR    镜像里不再 apt-get install openssl（那层只为 Prisma 查询引擎存在），
#                 没有 apt 操作就不需要 Debian 加速源
#
# 触发：推送任意分支 / 打 tag 都会自动构建并推送镜像；也可在页面 / API 手动触发。

stages:
  # 默认串行：check 全部通过才进入 image，避免为类型错误白跑一次 kaniko 构建。
  - check
  - image

variables:
  # 基础镜像：Node 24 LTS；Docker Hub 官方仓库经加速域名拉取
  # 若该路径 404，可去掉 library/ 前缀试试：docker.1ms.run/node:24-bookworm-slim
  NODE_IMAGE: docker.1ms.run/library/node:24-bookworm-slim
  # npm 加速源；留空则用官方 registry.npmjs.org
  NPM_REGISTRY: https://registry.npmmirror.com

workflow:
  rules:
    # 任意分支 / tag 的推送都自动跑（tag 推送的 source 同样是 push）
    - if: $CI_PIPELINE_SOURCE == "push"
      when: always
    # 页面手动 Run pipeline / API 触发
    - if: $CI_PIPELINE_SOURCE == "web"
      when: always
    - if: $CI_PIPELINE_SOURCE == "api"
      when: always
    - when: never

# 类型检查 + 结构漂移探针。
#
# 为什么不用 kaniko / 不放进 Dockerfile：这两件事都需要 devDependencies（typescript、
# ts-node、vue-tsc），而运行镜像里 `npm ci --omit=dev`；放在这里也才能"先失败、后构建镜像"。
#
# 为什么落在这个 stage 而不是各建各的：web 侧 nuxt build 只转译（esbuild/vite 不做类型检查），
# 所以 vue-tsc 是拦截 web 类型错误的唯一关卡；server 侧 nest build 会类型检查，但提前几分钟
# 暴露比等到镜像构建最后一段更省事，顺带把 DB 结构漂移探针一起跑了。
check:types:
  stage: check
  # 与镜像构建用同一个基础镜像变量（走加速域名）；若 runner 的 docker daemon 拉不动这个
  # 域名，把下面换成官方 node:24-bookworm-slim 即可（runner 侧有 Docker Hub 镜像源时更稳）。
  image:
    name: $NODE_IMAGE
    # 官方 node 镜像自带 entrypoint（docker-entrypoint.sh），跑脚本用不上，清空即可
    entrypoint: [""]
  interruptible: true
  variables:
    GIT_STRATEGY: clone
  script:
    # 两个包各自锁定依赖（各自有 package-lock.json），都用 NPM_REGISTRY 加速源，
    # 与镜像构建保持同一套解析结果，避免 CI 装到的版本和镜像里不一致。
    #
    # --ignore-scripts：better-sqlite3 的 npm 包带各平台预编译产物（prebuilds/*.node），
    # 但它同时带 binding.gyp 且没有 install 脚本，npm 会按默认行为补跑一次 node-gyp rebuild，
    # 而这套 node:24-bookworm-slim 里既没有 Python 也没有编译器，会直接
    #   gyp ERR! find Python / Error: Could not find any Python installation to use
    # 让 npm ci 挂掉（job 会在这一步就失败，后面的检查一个都跑不到）。
    # 跳过安装脚本即可：运行期 lib/binding.js 直接 require prebuilds/ 里的 .node 文件，
    # 不需要 build/ 目录，db:check-drift 照样能打开 SQLite 库。
    # Dockerfile 里两处 npm ci 出于同样原因已经带了 --ignore-scripts，这里保持一致。
    - cd server
    - npm ci --ignore-scripts --no-audit --no-fund --registry "$NPM_REGISTRY"
    - npm run typecheck
    # 全新 SQLite 库跑完迁移后 schema:log 必须零漂移 —— 实体改了忘写迁移时只有这个探针会响。
    # MySQL 需要外部实例，CI 里跑不了，所以这里只覆盖 SQLite 一侧。
    - npm run db:check-drift
    # node:test 套件（server/test/*.test.mjs）：配置解析、包装换算与前后端一致性、追溯码、
    # 多语言文案覆盖。零测试依赖，跑完不到 1 秒。
    - npm test
    - cd ../web
    - npm ci --no-audit --no-fund --registry "$NPM_REGISTRY"
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

docker:image:
  stage: image
  # 整个 job 在容器内执行，无需 docker daemon / dind。
  # kaniko 官方镜像只在 gcr.io：gcr.io/kaniko-project/executor:debug
  #   · 加速域名 → gcr.m.daocloud.io/kaniko-project/executor:debug（当前用法）
  #   · 注意不要用 docker.m.daocloud.io（那是 Docker Hub 加速，没有这个仓库，会报"不在白名单"）
  #   · runner 若能直连 gcr.io，也可改回官方地址
  # debug 变体自带 shell，脚本里的 heredoc / mkdir 依赖它
  image:
    name: gcr.m.daocloud.io/kaniko-project/executor:debug
    entrypoint: [""]
  interruptible: true
  variables:
    GIT_STRATEGY: clone
  # 基础设施层的保险：从加速域名拉基础镜像偶发中断（见下方 stream error 说明）时，
  # 整条 job 重跑一次即可恢复，配合下面的 kaniko 内建重试一起用。
  # 注意 GitLab 的 retry 只在 when 省略时对"任何失败"生效（含脚本退出码非 0），
  # 这里要的正是这个行为——因为镜像源的 stream error 表现为 kaniko 退出码 1。
  # max 上限就是 2；如果不想让真正的构建错误也重试，把这段删掉即可，
  # kaniko 自己的 --image-download-retry / --image-fs-extract-retry 仍然生效。
  retry:
    max: 2
  script:
    # 目标 tag：始终推 sha-<short>；默认分支额外推 latest；打 tag 额外推版本号；
    # 其它分支额外推分支名 slug，便于区分是哪个分支构建的
    - |
      dests="--destination $CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        dests="$dests --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        dests="$dests --destination $CI_REGISTRY_IMAGE:latest"
      else
        dests="$dests --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi
      echo "[ci] ref=${CI_COMMIT_REF_NAME} destinations: $dests"
    # 写 kaniko 推送凭据（项目容器注册表；CI_REGISTRY_* 为 GitLab 预置变量）
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
    # 在容器内构建并推送（无需 daemon）。
    #
    # 加速参数（都已在当前 kaniko 镜像的 --help 里确认存在，不是猜的）：
    #   --snapshot-mode=redo  快照只比对 mtime/size/mode/uid/gid，不再逐文件读内容。
    #                         本项目 node_modules 文件数极多，官方称最多可省约 50% 快照时间。
    #   --use-new-run         RUN 阶段不再做全盘快照，改用 marker 文件 + 遍历 mtime 找变更，
    #                         官方称总构建时间可降约 75%。代价是极端情况下可能漏文件，
    #                         本镜像的 RUN 都是 npm ci / tsc 编译这类整体产物，可以接受。
    #   --compressed-caching=false
    #                         官方 --help 原文：该选项默认 true，语义是"压缩缓存层，
    #                         降低构建时间但**增加内存占用**"。本项目镜像里有 3 个 npm ci
    #                         产生的数百 MB 层，kaniko 会把它们的压缩结果一直留在内存里
    #                         直到整个构建结束。实测峰值内存 4.43 GiB → 3.54 GiB。
    #   --ignore-path=/root/.npm
    #                         见下面"kaniko 会忽略 cache mount"那段：既然挂载被忽略，
    #                         各阶段 npm 下载的 tarball 都会留在 /root/.npm 里被快照进层。
    #                         排除它直接缩小被快照/压缩的数据量。
    #   （两者都是为 OOM 加的：只加上面两条时实测峰值 4.43 GiB → 3.42 GiB。见下方 OOM 说明。）
    #
    # 注意 Dockerfile 里 npm ci 用了 BuildKit 的 --mount=type=cache：
    # 实测当前 kaniko（gcr.io/kaniko-project/executor，Google 仓库 2025 年已归档，
    # 停在 v1.24.0 一代）会解析但**忽略**该挂载 —— 构建不会失败，只是 npm 缓存会落进层里、
    # 拿不到缓存挂载的跨构建收益。本地 docker build / BuildKit 构建仍能吃到这个加速。
    # 若要让 CI 也吃到，需把上面的 kaniko 镜像换成仍在维护、已实现 cache mount 的分支
    # （例如 ghcr.io/osscontainertools/kaniko:debug 或 docker.io/martizih/kaniko:debug）。
    #
    # ── 关于 OOM（Job failed: exit code 137，日志停在 "Taking snapshot of files..." 之后）──
    # 症状：构建跑到 web 阶段 `cd web && npm ci` 之后，kaniko 刚开始为这一层做快照
    #       （打包 + 压缩那 ~600MB 的 node_modules）就被 SIGKILL，日志只有一行 Killed。
    #       实测这一步是整个构建的内存峰值点，因此每次都在同一个位置被杀。
    #
    # 根因不在这一步本身，而在于**每次构建都是全冷构建**：kaniko 的层缓存从来没能命中
    # 那些昂贵的 npm ci 层，所以每次都必须重新执行 npm ci 并重新做那个最大的快照。
    # 缓存为什么命中不了，实测结论是 Dockerfile 里 `WORKDIR /app` 写在了 `base` 阶段——
    # 也就是被 4 个子阶段通过 `FROM base AS …` 继承的那个阶段：
    #   · WORKDIR 会在构建时创建目录，目录 mtime 每次构建都不同 → 该层 digest 每次都变
    #   · 子阶段据此算出的 base digest 随之改变 → 它们的 cache key 全部重算 → 永不命中
    # 对照实验（同一 Dockerfile、同一批参数，只改 WORKDIR 位置）：
    #   · WORKDIR 在 base 里      → 8 层只有最上面 1 层命中，重建 310s，峰值 4.43 GiB
    #   · WORKDIR 下放到各子阶段  → 8 层全部命中，重建 99s，峰值 1.21 GiB
    # 所以 Dockerfile 里已把 WORKDIR 移到各子阶段（那里是安全的，实测不命中只发生在
    # "被继承的父阶段"有 WORKDIR 时）。改完之后 package.json/lock 没变的重建会直接命中
    # npm ci 层，那个致命快照根本不会发生。
    # 注：曾怀疑过上下文 mtime、--use-new-run、--reproducible、被忽略的 --mount=type=cache，
    #     这四项都已实测排除（归一化 mtime 后仍然 miss；去掉 --use-new-run 后仍然 miss）。
    #
    # 上面两个内存参数则是为了**让修好之后的那一次构建能活下来**：缓存只有在某次构建
    # 成功跑完后才会被填上，如果第一次仍旧 OOM，就永远享受不到命中。它们把那次构建的
    # 峰值从 4.43 GiB 压到 3.42 GiB。
    #
    # 重试开关：kaniko 从加速域名拉基础镜像时，层流会被对端中途掐断，报
    #   error building stage: failed to get filesystem from image:
    #   stream error: stream ID 3; INTERNAL_ERROR; received from peer
    # （HTTP/2 流错误，manifest 能取到、层数据下载中断，属于镜像源侧瞬时故障；
    #   实测同一镜像源拉小镜像正常，所以不是配置问题）。
    # --image-fs-extract-retry 正对 "failed to get filesystem" 这一步，
    # --image-download-retry 覆盖层下载本身，--push-retry 覆盖推送到项目仓库的偶发失败。
    # 三个都设成 3，避免一次网络抖动就让整条流水线失败。
    - |
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --build-arg NODE_IMAGE="$NODE_IMAGE" \
        --build-arg NPM_REGISTRY="$NPM_REGISTRY" \
        --cache=true \
        --cache-repo "$CI_REGISTRY_IMAGE/cache" \
        --snapshot-mode=redo \
        --use-new-run \
        --compressed-caching=false \
        --ignore-path=/root/.npm \
        --image-download-retry=3 \
        --image-fs-extract-retry=3 \
        --push-retry=3 \
        $dests
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
