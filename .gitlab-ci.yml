# Homebucket GitLab CI
#
# 关于"屏蔽推送后的自动检查"：
#   1. 仓库里存在 .gitlab-ci.yml 后，GitLab 的 Auto DevOps 自动流水线不会再运行；
#   2. 本文件没有 include 任何 SAST / Secret-Detection / Dependency-Scanning 等安全模板，
#      所以推送后不会自动跑这些检查任务；
#   3. workflow.rules 把 push、merge_request、schedule 触发的流水线全部挡掉，
#      只有在 GitLab 页面手动 "Run pipeline"、API 触发，或打 tag 时才执行。
#
# 想恢复推送即构建：把 workflow.rules 里的 `- when: never` 改成
#   - if: $CI_COMMIT_BRANCH
#     when: always

stages:
  - build
  - docker

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" # 在 GitLab 页面手动 Run pipeline
      when: always
    - if: $CI_PIPELINE_SOURCE == "api"
      when: always
    - if: $CI_COMMIT_TAG
      when: always
    - when: never

.node:
  image: node:22-slim
  before_script:
    # Prisma 查询引擎依赖 openssl
    - apt-get update -y && apt-get install -y --no-install-recommends openssl && rm -rf /var/lib/apt/lists/*

build:server:
  extends: .node
  stage: build
  cache:
    key:
      files:
        - server/package-lock.json
    paths:
      - server/node_modules/
  script:
    - cd server
    - npm ci --no-audit --no-fund
    - npx prisma generate --schema "prisma/${DB_PROVIDER:-mysql}/schema.prisma"
    - npm run build

build:web:
  extends: .node
  stage: build
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/node_modules/
  script:
    - cd web
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    paths:
      - web/.output/
    expire_in: 1 week

docker:image:
  stage: docker
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
  when: manual # 手动触发，避免推送后自动构建镜像
  script:
    - docker build --build-arg DB_PROVIDER=${DB_PROVIDER:-mysql} -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
